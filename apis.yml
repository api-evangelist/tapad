name: TapAd
description: >-
  Tapad is a digital identity and cross-device graph technology company, founded
  in 2010 and headquartered in New York City. Its flagship product, the Tapad
  Graph, is a probabilistic device graph that lets marketers, agencies, and
  platforms recognize a brand's customer or related household across the many
  devices they use, powering programmatic targeting, media measurement,
  attribution, and personalization. Tapad was acquired by the Norwegian telecom
  Telenor in 2016 and then by the credit-and-data company Experian in 2020, where
  its cross-device graph is offered as part of Experian's marketing and identity
  resolution portfolio. Tapad's technology is delivered primarily as a data
  partnership and graph-integration offering rather than a self-service public
  developer API; the company does not publish an open developer portal, API
  reference, or SDKs. It was added to the API Evangelist network as a portfolio
  company of Battery Ventures.
