apis:
- name: Tapad Tapestry Web API
  description: >-
    The Tapestry Web API is Tapad's cross-device identity and audience endpoint.
    A client sends a GET request carrying a Tapad-issued partner id plus one or
    more device or user identifiers, and Tapad resolves them to a device clique
    in the Tapad Graph. The same call can read back key/value data, audience
    tags, resolved identifiers and the list of devices in the clique, and can
    write data and audience membership onto that clique. All input travels in
    the query string under a ta_ prefix; the response is a flat JSON object.
    Errors are returned with HTTP 200 and a proprietary errors[] envelope rather
    than a status code. The endpoint is live and answering as of 2026-08-12, but
    the only published clients for it are SDKs Tapad archived in 2014.
  humanURL: https://github.com/Tapad/tapestry-ios-sdk
  baseURL: https://tapestry.tapad.com/tapestry/1
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/tapad.png
  tags:
  - Identity
  - Cross-Device
  - Device Graph
  - Audience
  - Identity Resolution
