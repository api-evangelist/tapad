name: TapAd
description: >-
  Tapad is a digital identity and cross-device graph technology company, founded
  in 2010 and headquartered in New York City. Its flagship product, the Tapad
  Graph, is a probabilistic device graph that lets marketers, agencies, and
  platforms recognize a brand's customer or related household across the many
  devices they use, powering programmatic targeting, media measurement,
  attribution, and personalization. Tapad was acquired by the Norwegian telecom
  Telenor in 2016 and then by the credit-and-data company Experian in 2020, and
  by 2026 its product and company pages redirect into Experian's Consumer Sync
  marketing suite while docs.tapad.com redirects to Experian's client-only
  Marketing Knowledge Base. Tapad runs no public developer program — no portal,
  no OpenAPI, no pricing and no self-service signup — but it does still operate
  two live first-party HTTP endpoints, the Tapestry Web API and an event
  tracking beacon, both requiring a partner id that only Tapad can issue, and it
  published four open-source mobile SDKs that it has since archived as
  unmaintained. It was added to the API Evangelist network as a portfolio
  company of Battery Ventures.
