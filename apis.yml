- name: Tapad Event Tracking API
  description: >-
    Tapad's app install and in-app event tracking beacon, documented in the
    company's own open-source mobile SDKs as the RESOURCE_URL for the
    event-tracking module. A client sends a GET request with a Tapad-issued
    partner id and event parameters; the service answers HTTP 200 with a 1x1 PNG.
    The companion ad-serving endpoint that shipped in the same SDK,
    swappit.tapad.com, no longer resolves in DNS. The event endpoint is live as
    of 2026-08-12.
  humanURL: https://github.com/Tapad/tapad-android-sdk
  baseURL: https://analytics.tapad.com/app/event
