method: probed
source: >-
  Live HTTP probes of tapad.com and its subdomains on 2026-08-12, plus
  github.com/Tapad repository archive state read via gh api.
note: >-
  Tapad publishes NO versioning policy, NO deprecation policy, NO Sunset or
  Deprecation headers (RFC 8594), NO SLA and NO status page. What it does have
  is an unusually well-evidenced decay profile, recorded below from probes
  rather than from any provider statement. Nothing here is a Tapad commitment;
  it is observed lifecycle state.

versioning:
  policy_published: false
  scheme: path segment
  current_version: '1'
  first_seen: '2013'
  note: >-
    tapestry/1 is the version the 2013 SDKs targeted and the version still
    answering in 2026. No v2 has ever been announced.

deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  note: >-
    No RFC 8594 Sunset or Deprecation header appeared on any probed response.
    Deprecation at Tapad has been carried out by silent removal, not by
    announcement — see retired_surfaces below.

sla:
  published: false

status_page:
  published: false
  note: >-
    No status.tapad.com, no statuspage.io tenant and no status link on any live
    page. No StatusPage pointer is emitted in apis.yml.

