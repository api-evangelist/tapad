client_library_decay:
  newest_first_party_sdk_release: '2014-03-12'
  newest_first_party_sdk: tapestry-ios-sdk v1.3.1
  all_sdks_archived: true
  gap_years: 12
  note: >-
    Every first-party SDK is marked "archived as unmaintained" by Tapad. The
    Tapestry Web API those SDKs call is still answering today, so the only
    published clients for a running service are twelve years stale. See
    packages/tapad-packages.yml.

